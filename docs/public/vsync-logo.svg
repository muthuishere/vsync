<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" fill="none" role="img" aria-label="Vsync — a vault encircled by sync arrows">
  <defs>
    <linearGradient id="vsync-accent" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#7c83ff"/>
      <stop offset="100%" stop-color="#5b65f0"/>
    </linearGradient>
  </defs>

  <!-- Sync ring: top arc, clockwise -->
  <path d="M 108 145 A 110 110 0 0 1 292 145"
        stroke="url(#vsync-accent)" stroke-width="5" stroke-linecap="round"/>
  <path d="M 292 145 L 275 130 M 292 145 L 308 132"
        stroke="url(#vsync-accent)" stroke-width="5" stroke-linecap="round"/>

  <!-- Sync ring: bottom arc, counter-clockwise -->
  <path d="M 292 255 A 110 110 0 0 1 108 255"
        stroke="url(#vsync-accent)" stroke-width="5" stroke-linecap="round"/>
  <path d="M 108 255 L 125 270 M 108 255 L 92 268"
        stroke="url(#vsync-accent)" stroke-width="5" stroke-linecap="round"/>

  <!-- Subtle data dots floating around the vault (suggesting team / secrets) -->
  <g fill="url(#vsync-accent)" opacity="0.55">
    <circle cx="68" cy="200" r="4"/>
    <circle cx="332" cy="200" r="4"/>
    <circle cx="200" cy="68" r="4"/>
    <circle cx="200" cy="332" r="4"/>
  </g>

  <!-- Vault body -->
  <rect x="125" y="125" width="150" height="150" rx="16"
        stroke="currentColor" stroke-width="4"/>

  <!-- Hinges on the left edge -->
  <g stroke="currentColor" stroke-width="3.5" stroke-linecap="round">
    <line x1="125" y1="155" x2="138" y2="155"/>
    <line x1="125" y1="200" x2="138" y2="200"/>
    <line x1="125" y1="245" x2="138" y2="245"/>
  </g>

  <!-- Door handle (right side) -->
  <line x1="252" y1="200" x2="263" y2="200"
        stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="266" cy="200" r="4" fill="currentColor"/>

  <!-- Combination dial: outer ring -->
  <circle cx="200" cy="200" r="40"
          stroke="currentColor" stroke-width="3"/>

  <!-- Dial indicator (pointing up) -->
  <line x1="200" y1="200" x2="200" y2="168"
        stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Center hub -->
  <circle cx="200" cy="200" r="6" fill="url(#vsync-accent)"/>

  <!-- Quadrant tick marks on the dial -->
  <g stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.4">
    <line x1="200" y1="154" x2="200" y2="160"/>
    <line x1="200" y1="240" x2="200" y2="246"/>
    <line x1="154" y1="200" x2="160" y2="200"/>
    <line x1="240" y1="200" x2="246" y2="200"/>
  </g>
</svg>
