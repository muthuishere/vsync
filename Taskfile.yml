version: '3'

# Root Taskfile — orchestrates the polyglot monorepo.
#
# All packages share a single unified version (see VERSION below). Per-lib
# Taskfiles handle build/test/publish for their ecosystem; this root file
# aggregates them and owns the repo-level operations (tagging, push).
#
# Quickstart:
#   task                 # list all tasks
#   task test:all        # run every test suite
#   task tag:release     # create v$VERSION + libraries/go/v$VERSION tags
#   task publish:all     # publish CLI + Python + TS + tag Go (in order)

vars:
  VERSION: "0.11.0"

includes:
  python:
    taskfile: ./libraries/python/Taskfile.yml
    dir: ./libraries/python
  ts:
    taskfile: ./libraries/typescript/Taskfile.yml
    dir: ./libraries/typescript
  go:
    taskfile: ./libraries/go/Taskfile.yml
    dir: ./libraries/go

tasks:
  default:
    desc: List all available tasks
    cmds:
      - task -l --sort=alphanumeric
    silent: true

  test:cli:
    desc: Run the Bun CLI test suite
    cmds:
      - bun test

  test:all:
    desc: Run every test suite — CLI + Python + TypeScript + Go
    cmds:
      - task: test:cli
      - task: python:test
      - task: ts:test
      - task: go:test

  check:version:
    desc: Verify the unified version is consistent across all packages
    silent: true
    cmds:
      - |
        EXPECTED="{{.VERSION}}"
        CLI=$(jq -r .version package.json)
        TS=$(jq -r .version libraries/typescript/package.json)
        PY=$(grep -E '^version = ' libraries/python/pyproject.toml | sed 's/.*"\(.*\)".*/\1/')
        if [ "$CLI" != "$EXPECTED" ] || [ "$TS" != "$EXPECTED" ] || [ "$PY" != "$EXPECTED" ]; then
          echo "✘ version drift detected:"
          echo "  expected: $EXPECTED"
          echo "  CLI:      $CLI"
          echo "  TS:       $TS"
          echo "  Python:   $PY"
          exit 1
        fi
        echo "✓ all packages at $EXPECTED"

  tag:release:
    desc: Tag v{{.VERSION}} + libraries/go/v{{.VERSION}} (Go subpath module convention)
    preconditions:
      - sh: 'git diff --quiet && git diff --cached --quiet'
        msg: "Working tree must be clean before tagging"
      - sh: '! git rev-parse v{{.VERSION}} 2>/dev/null'
        msg: "Tag v{{.VERSION}} already exists"
    cmds:
      - task: check:version
      - git tag -a v{{.VERSION}} -m "vsync v{{.VERSION}} (unified release)"
      - git tag -a libraries/go/v{{.VERSION}} -m "vsync-s3-client-go v{{.VERSION}}"
      - 'echo "✓ Tagged v{{.VERSION}} and libraries/go/v{{.VERSION}}. Run \`git push --tags\` to publish."'

  publish:cli:
    desc: Publish the Bun CLI (@muthuishere/vsync) to npm
    preconditions:
      - sh: 'git diff --quiet && git diff --cached --quiet'
        msg: "Working tree must be clean before publish"
    cmds:
      - task: check:version
      - bun test
      - bun publish --access=public

  publish:all:
    desc: Publish CLI + Python + TS + tag-push Go. Run after `task tag:release` + `git push --tags`.
    cmds:
      - task: publish:cli
      - task: python:publish
      - task: ts:publish
      - 'echo "Go module is resolved from the git tag; ensure libraries/go/v{{.VERSION}} has been pushed."'

  clean:all:
    desc: Clean all build artifacts across every lib
    cmds:
      - task: python:clean
      - task: ts:clean
      - task: go:clean
