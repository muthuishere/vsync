version: '3'

# Taskfile for libraries/typescript/ — @muthuishere/vsync-s3-client
#
# Toolchain: npm (or pnpm/bun — all compatible since package.json + lock file).
# Auth for publish: `npm login` (creates ~/.npmrc) OR set NODE_AUTH_TOKEN.
#
# Scoped public package — `--access=public` is required on first publish.

vars:
  VERSION: "0.11.0"
  PACKAGE: "@muthuishere/vsync-s3-client"

tasks:
  default:
    desc: List TypeScript lib tasks
    cmds:
      - task -l --sort=alphanumeric
    silent: true

  install:
    desc: Install dependencies (refreshes package-lock.json)
    cmds:
      - npm install --no-audit --no-fund

  test:
    desc: Run vitest suite (unit + conformance)
    cmds:
      - npm test

  test:conformance:
    desc: Run only the cross-language conformance suite
    cmds:
      - npx vitest run test/conformance.test.ts

  typecheck:
    desc: Run tsc --noEmit
    cmds:
      - npx tsc --noEmit

  build:
    desc: Compile TypeScript to dist/
    deps: [install]
    cmds:
      - npm run build
      - ls -la dist/

  clean:
    desc: Remove dist/ and node_modules/
    cmds:
      - rm -rf dist node_modules

  check:
    desc: Verify package.json version + dist artefacts
    deps: [build]
    silent: true
    cmds:
      - |
        PKG_VERSION=$(node -p "require('./package.json').version")
        if [ "$PKG_VERSION" != "{{.VERSION}}" ]; then
          echo "✘ package.json version $PKG_VERSION ≠ Taskfile {{.VERSION}}"
          exit 1
        fi
        if [ ! -f dist/index.js ] || [ ! -f dist/index.d.ts ]; then
          echo "✘ dist/ missing index.js or index.d.ts"
          exit 1
        fi
        echo "✓ version {{.VERSION}} matches"
        echo "✓ dist/index.{js,d.ts} present"

  publish:
    desc: Publish {{.PACKAGE}}@{{.VERSION}} to npm (scoped, public)
    deps: [test, typecheck, check]
    cmds:
      - 'echo "Publishing {{.PACKAGE}}@{{.VERSION}} to npm..."'
      - npm publish --access=public

  publish:dry-run:
    desc: Run `npm publish --dry-run` to preview the publish without uploading
    deps: [test, typecheck, check]
    cmds:
      - npm publish --dry-run --access=public
