name: Release

# Publishes the unified release on a `v*` tag.
#
# AUTH MODEL — OIDC trusted publishing, no long-lived tokens where possible:
#
#   npm (CLI + TS lib)  OIDC trusted publishing. Requires a Trusted Publisher
#                       configured per package on npmjs.com pointing at this
#                       repo + workflow filename, and npm CLI >= 11.5.1.
#                       No NPM_TOKEN secret.
#   PyPI (Python lib)   OIDC trusted publishing via pypa/gh-action-pypi-publish.
#                       Requires a Trusted Publisher on pypi.org for the
#                       project. No PYPI_TOKEN secret.
#   Maven Central       NOT OIDC. Sonatype's Central Portal has no GitHub OIDC
#                       trusted-publisher flow, so this job still needs a user
#                       token + a GPG signing key as secrets, and is gated on
#                       those secrets being present.
#   Go                  Nothing to publish — the module is resolved straight
#                       from the `libraries/go/v*` tag. Pushing the tag IS the
#                       release.
#
# `id-token: write` is what mints the OIDC token; without it both trusted-
# publish paths fall back to failing rather than silently using a token.

on:
  push:
    tags:
      - "v*"          # deliberately NOT libraries/go/v* — that tag is the Go release
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify everything, publish nothing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Gate: the unified-version check and the full test suite must pass before
  # anything is published. A partial release across four registries is very
  # unpleasant to unwind, so everything is verified up front.
  # ─────────────────────────────────────────────────────────────────────────
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Resolve version
        id: v
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Tag must match package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG="${{ steps.v.outputs.version }}"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json $PKG"
            exit 1
          fi

      - name: Unified version across all packages
        uses: arduino/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task check:version

      - run: bun install --frozen-lockfile
      - run: bun test

  # ─────────────────────────────────────────────────────────────────────────
  # npm — the CLI. OIDC trusted publishing; note `npm publish`, not
  # `bun publish`, because the OIDC handshake lives in the npm CLI.
  # ─────────────────────────────────────────────────────────────────────────
  publish-cli:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: npm >= 11.5.1 (OIDC support)
        run: npm install -g npm@latest

      - name: Publish @muthuishere/vsync
        if: ${{ !inputs.dry_run }}
        run: npm publish --access public

      - name: Dry run
        if: ${{ inputs.dry_run }}
        run: npm publish --access public --dry-run

  # ─────────────────────────────────────────────────────────────────────────
  # npm — the TypeScript runtime library.
  # ─────────────────────────────────────────────────────────────────────────
  publish-ts:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: libraries/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - run: npm install -g npm@latest
      - run: npm ci || npm install
      - run: npm test
      - run: npm run build --if-present

      - name: Publish @muthuishere/vsync-s3-client
        if: ${{ !inputs.dry_run }}
        run: npm publish --access public

      - name: Dry run
        if: ${{ inputs.dry_run }}
        run: npm publish --access public --dry-run

  # ─────────────────────────────────────────────────────────────────────────
  # PyPI — OIDC trusted publishing. The action reads the OIDC token itself;
  # there is no password/token input on purpose.
  # ─────────────────────────────────────────────────────────────────────────
  publish-python:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --upgrade build pytest
        working-directory: libraries/python

      - name: Test
        working-directory: libraries/python
        run: |
          pip install -e .
          pytest -q

      - name: Build sdist + wheel
        working-directory: libraries/python
        run: python -m build

      - name: Publish to PyPI
        if: ${{ !inputs.dry_run }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: libraries/python/dist

  # ─────────────────────────────────────────────────────────────────────────
  # Go — nothing to upload. The proxy resolves the module from the tag, so
  # this job just proves the tag exists and the package builds.
  # ─────────────────────────────────────────────────────────────────────────
  verify-go:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - run: go test ./...
        working-directory: libraries/go

      - name: Companion Go tag must exist
        run: |
          V="${{ needs.verify.outputs.version }}"
          if git rev-parse "libraries/go/v$V" >/dev/null 2>&1; then
            echo "✓ libraries/go/v$V present — the Go module release is live"
          else
            echo "::warning::libraries/go/v$V is missing. Go consumers cannot resolve v$V until you push it (task tag:release creates both tags)."
          fi

  # ─────────────────────────────────────────────────────────────────────────
  # Maven Central — the one registry with no OIDC path. Skipped entirely
  # unless the signing secrets are configured, so the rest of the release
  # is never blocked by it.
  # ─────────────────────────────────────────────────────────────────────────
  publish-java:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Are Central credentials configured?
        id: gate
        env:
          USER_TOKEN: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
        run: |
          if [ -n "$USER_TOKEN" ]; then echo "ready=true" >> "$GITHUB_OUTPUT";
          else echo "ready=false" >> "$GITHUB_OUTPUT";
               echo "::notice::Skipping Maven Central — CENTRAL_TOKEN_USERNAME not set. Publish manually with 'task java:publish'."; fi

      - uses: actions/setup-java@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: "21"
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Publish to Maven Central
        if: ${{ steps.gate.outputs.ready == 'true' && !inputs.dry_run }}
        working-directory: libraries/java
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: mvn --batch-mode -P release deploy
