name: Release

# Publishes on a `v*` tag.
#
# SCOPE — only the CLI is published. As of 0.15.0 the CLI is the sole artifact
# that has ever shipped:
#
#   @muthuishere/vsync              npm      PUBLISHED  <- this workflow
#   @muthuishere/vsync-s3-client    npm      never published
#   vsync-s3-client                 PyPI     never published
#   io.github.muthuishere:...       Maven    never published
#   libraries/go                    (none)   resolved from the git tag
#
# The libraries are still built and tested here so a release can't ship a CLI
# that sits alongside broken library code — but nothing uploads them. When one
# is ready to publish for real, see RELEASING.md; the short version is that
# npm and Maven need the package to EXIST before a trusted publisher can be
# attached, so each library needs one manual first publish before CI can take
# over via OIDC.
#
# AUTH — npm OIDC trusted publishing. No NPM_TOKEN in this repo. Requires a
# Trusted Publisher on npmjs.com for @muthuishere/vsync pointing at this repo
# + `release.yml`, and npm CLI >= 11.5.1. `id-token: write` mints the token.

on:
  push:
    tags:
      - "v*"          # deliberately NOT libraries/go/v* — that tag IS the Go release
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run every check and publish nothing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Everything must be green before the single publish job runs.
  # ─────────────────────────────────────────────────────────────────────────
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Resolve version
        id: v
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Tag must match package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG="${{ steps.v.outputs.version }}"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json $PKG"
            exit 1
          fi

      - uses: arduino/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Unified version across all packages
        run: task check:version

      - run: bun install --frozen-lockfile
      - run: bun test

  # ─────────────────────────────────────────────────────────────────────────
  # Libraries: proven, not published. Keeps a release honest without
  # pretending these ship. `continue-on-error` is deliberately NOT set — if a
  # library is broken, the release should stop and be looked at.
  # ─────────────────────────────────────────────────────────────────────────
  verify-libraries:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Go
        working-directory: libraries/go
        run: go test ./...

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: TypeScript
        working-directory: libraries/typescript
        run: |
          npm ci || npm install
          npm test

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python
        working-directory: libraries/python
        run: |
          pip install -e . pytest
          pytest -q

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Java
        working-directory: libraries/java
        run: mvn --batch-mode test

      - name: Companion Go tag
        run: |
          V="${{ needs.verify.outputs.version }}"
          if git rev-parse "libraries/go/v$V" >/dev/null 2>&1; then
            echo "✓ libraries/go/v$V present — Go consumers can resolve v$V"
          else
            echo "::warning::libraries/go/v$V missing — push it so Go can resolve v$V (task tag:release creates both tags)"
          fi

  # ─────────────────────────────────────────────────────────────────────────
  # The only thing that actually ships. npm OIDC — note `npm publish`, not
  # `bun publish`: the OIDC handshake lives in the npm client.
  # ─────────────────────────────────────────────────────────────────────────
  publish-cli:
    needs: [verify, verify-libraries]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: npm >= 11.5.1 (OIDC support)
        run: npm install -g npm@latest

      - name: Publish @muthuishere/vsync
        if: ${{ !inputs.dry_run }}
        run: npm publish --access public

      - name: Dry run
        if: ${{ inputs.dry_run }}
        run: npm publish --access public --dry-run
