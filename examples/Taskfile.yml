version: '3'

# Example Taskfile.yml for a consuming repo (copy to infra/setup/Taskfile.yml
# or generate via `bunx @muthuishere/secret-lib initapp`).
#
# Run from anywhere:
#   task -t infra/setup/Taskfile.yml init     ENV=dev
#   task -t infra/setup/Taskfile.yml push     ENV=dev
#   task -t infra/setup/Taskfile.yml pull     ENV=dev
#   task -t infra/setup/Taskfile.yml export   ENV=dev
#   task -t infra/setup/Taskfile.yml import   ENV=dev FILE=./reqsume-dev.share
#
# Or use the per-env shortcuts:
#   task -t infra/setup/Taskfile.yml dev:pull
#   task -t infra/setup/Taskfile.yml local:push

vars:
  SECRET_LIB: bunx @muthuishere/secret-lib

tasks:
  init:
    desc: 'Generate key + config file for (repo, env) (var ENV=...)'
    preconditions: [{ sh: '[ -n "{{.ENV}}" ]', msg: 'ENV is required (e.g. ENV=dev)' }]
    cmds: ['{{.SECRET_LIB}} init {{.ENV}}']

  push:
    desc: 'Encrypt + upload local .env + vault to S3 (var ENV=...)'
    preconditions: [{ sh: '[ -n "{{.ENV}}" ]', msg: 'ENV is required' }]
    cmds: ['{{.SECRET_LIB}} push {{.ENV}}']

  pull:
    desc: 'Download + decrypt the latest bundle from S3 (var ENV=...)'
    preconditions: [{ sh: '[ -n "{{.ENV}}" ]', msg: 'ENV is required' }]
    cmds: ['{{.SECRET_LIB}} pull {{.ENV}}']

  export:
    desc: 'Write a passphrase-encrypted .share file for teammates (var ENV=...)'
    preconditions: [{ sh: '[ -n "{{.ENV}}" ]', msg: 'ENV is required' }]
    cmds: ['{{.SECRET_LIB}} export {{.ENV}}']

  import:
    desc: 'Read a .share file (var ENV=..., FILE=path-to-.share)'
    preconditions:
      - { sh: '[ -n "{{.ENV}}" ]',  msg: 'ENV is required' }
      - { sh: '[ -n "{{.FILE}}" ]', msg: 'FILE is required' }
    cmds: ['{{.SECRET_LIB}} import {{.ENV}} {{.FILE}}']

  # Per-env shortcuts. Add as many as you have envs.
  local:pull: { cmds: [{ task: pull, vars: { ENV: local      } }] }
  local:push: { cmds: [{ task: push, vars: { ENV: local      } }] }
  dev:pull:   { cmds: [{ task: pull, vars: { ENV: dev        } }] }
  dev:push:   { cmds: [{ task: push, vars: { ENV: dev        } }] }
  prod:pull:  { cmds: [{ task: pull, vars: { ENV: production } }] }
  prod:push:  { cmds: [{ task: push, vars: { ENV: production } }] }

  status:
    desc: Check that the setup tools are installed
    cmds:
      - |
        echo "🔍 Setup-tool status:"
        for tool in git bun bunx; do
          if command -v $tool &> /dev/null; then
            echo "✅ $tool: $($tool --version 2>&1 | head -1)"
          else
            echo "❌ $tool: Not installed"
          fi
        done
